# The shared Docker host (Traefik) on top of docker-compose.prod.yml: nginx is
# reached by Traefik over its network instead of a host port, and the stack
# keeps its own Redis. The database comes from compose.platform-postgres.yml or
# compose.mariadb.yml (DATABASE_STACK). Used by deploy/production/bootstrap.sh.
services:
  nginx:
    ports: !reset []
    networks:
      - internal
      - edge
