# The edge proxy of the dedicated adriaholiday VPS, installed by
# deploy/production/provision-host.sh into /srv/apps/traefik. Routes come from
# the dynamic directory (bootstrap.sh writes adriaholiday.yml there);
# certificates are issued by Let's Encrypt over the HTTP challenge.
services:
  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=30m
      - --certificatesresolvers.letsencrypt.acme.email=__ACME_EMAIL__
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --ping=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - 80:80
      - 443:443
    volumes:
      - /srv/apps/traefik/dynamic:/etc/traefik/dynamic:ro
      - /srv/data/traefik:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - platform

networks:
  platform:
    external: true
