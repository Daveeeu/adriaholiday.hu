# Backend and frontend checks. Run on every pull request to main and by the
# release workflow before it builds anything (docs/release-pipeline.md).
name: Checks

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint, PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, exif, gd, intl, pdo_sqlite, zip, redis
          coverage: none
          ini-values: memory_limit=1G
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint --test
      - name: PHPUnit
        run: |
          cp .env.example .env
          php artisan key:generate --quiet
          php artisan test

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [site, adria-admin]
    defaults:
      run:
        working-directory: ${{ matrix.app == 'site' && '.' || matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app == 'site' && 'package-lock.json' || 'adria-admin/package-lock.json' }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
