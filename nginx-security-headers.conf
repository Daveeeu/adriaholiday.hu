# Included by every location that sets its own add_header, because nginx drops
# inherited add_header directives as soon as a location defines one.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The microphone is allowed for the site itself only: the AI travel assistant demo talks to visitors.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
# $csp_form_action is 'self', plus the AI assistants on their OAuth consent screen (nginx.conf).
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action $csp_form_action" always;
# Browsers ignore HSTS on plain-HTTP responses, so this is inert on local stacks.
add_header Strict-Transport-Security "max-age=31536000" always;
