# Included by every location that sets its own add_header, because nginx drops
# inherited add_header directives as soon as a location defines one.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
# Browsers ignore HSTS on plain-HTTP responses, so this is inert on local stacks.
add_header Strict-Transport-Security "max-age=31536000" always;
