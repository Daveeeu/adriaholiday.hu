services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PORTFOLIO_VITE_API_BASE_URL: /api
        PORTFOLIO_VITE_SITE_URL: http://adriaholiday.lan
        PORTFOLIO_VITE_ANALYTICS_ENABLED: "false"
        ADMIN_VITE_API_BASE_URL: /api/admin
    image: adriaholiday/app:local
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://adriaholiday.lan
      ASSET_URL: http://adriaholiday.lan
      CORS_ALLOWED_ORIGINS: http://adriaholiday.lan
      REDIS_HOST: redis
    volumes:
      - ./backend/storage:/var/www/backend/storage
      - ./backend/database:/var/www/backend/database
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan app:healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - local

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - local

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PORTFOLIO_VITE_API_BASE_URL: /api
        PORTFOLIO_VITE_SITE_URL: http://adriaholiday.lan
        PORTFOLIO_VITE_ANALYTICS_ENABLED: "false"
        ADMIN_VITE_API_BASE_URL: /api/admin
    image: adriaholiday/nginx:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./backend/storage:/var/www/backend/storage:ro
    networks:
      - local

volumes:
  redis-data:

networks:
  local:
    driver: bridge
